name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read app version
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          if (-not $match) { throw 'Missing version in pubspec.yaml' }
          $version = $match.Matches[0].Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+\+\d+$') { throw 'Use numeric version MAJOR.MINOR.PATCH+BUILD in pubspec.yaml' }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must be v$version" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install dependencies and build
        shell: pwsh
        run: |
          try { Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY" -Method Head -MaximumRedirection 2 | Out-Null }
          catch { throw "Release repository $env:GITHUB_REPOSITORY must be public and reachable without signing in" }
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'flutter pub get failed' }
          flutter analyze
          if ($LASTEXITCODE -ne 0) { throw 'flutter analyze failed' }
          flutter test
          if ($LASTEXITCODE -ne 0) { throw 'flutter test failed' }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'flutter build windows failed' }
      - name: Install packaging tools
        shell: pwsh
        run: choco install innosetup openssl.light 7zip -y --no-progress
      - name: Package installer
        shell: pwsh
        run: |
          if ($env:APP_VERSION -notmatch '^(\d+)\.(\d+)\.(\d+)\+(\d+)$') { throw 'Use numeric version MAJOR.MINOR.PATCH+BUILD in pubspec.yaml' }
          $windowsVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).$($Matches[4])"
          & .\scripts\prepare_7zip.ps1
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$env:APP_VERSION" "/DWindowsVersion=$windowsVersion" windows\installer\XXMI-Manager.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Sign installer and create appcast
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_DSA_PRIVATE_KEY_BASE64: ${{ secrets.WINDOWS_DSA_PRIVATE_KEY_BASE64 }}
        run: |
          if (-not $env:WINDOWS_DSA_PRIVATE_KEY_BASE64) { throw 'Missing WINDOWS_DSA_PRIVATE_KEY_BASE64 secret' }
          $env:PATH = "C:\Program Files\OpenSSL-Win64\bin;$env:PATH"
          $keyPath = Join-Path $env:RUNNER_TEMP 'dsa_priv.pem'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:WINDOWS_DSA_PRIVATE_KEY_BASE64))
          $secretPublic = Join-Path $env:RUNNER_TEMP 'secret-public.der'
          $repoPublic = Join-Path $env:RUNNER_TEMP 'repo-public.der'
          & openssl pkey -in $keyPath -pubout -outform DER -out $secretPublic
          if ($LASTEXITCODE -ne 0) { throw 'Invalid private key secret' }
          & openssl pkey -pubin -in dsa_pub.pem -outform DER -out $repoPublic
          if ($LASTEXITCODE -ne 0) { throw 'Invalid repository public key' }
          if ((Get-FileHash $secretPublic).Hash -ne (Get-FileHash $repoPublic).Hash) { throw 'Private key secret does not match dsa_pub.pem' }
          $installer = Join-Path $PWD 'dist\Visual-Mods-Manager-Setup.exe'
          $signed = dart run auto_updater:sign_update $installer $keyPath | Out-String
          if ($LASTEXITCODE -ne 0 -or $signed -notmatch 'sparkle:dsaSignature="([^"]+)"') { throw 'Installer signing failed' }
          $signature = $Matches[1]
          python scripts/create_appcast.py --repository $env:GITHUB_REPOSITORY --tag $env:GITHUB_REF_NAME --version $env:APP_VERSION --signature $signature --installer $installer --output dist/appcast.xml
          if ($LASTEXITCODE -ne 0) { throw 'Appcast generation failed' }
          Remove-Item $keyPath, $secretPublic, $repoPublic -Force
      - name: Upload build for testing
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: XXMI-Manager-Windows
          path: dist/Visual-Mods-Manager-Setup.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/Visual-Mods-Manager-Setup.exe dist/appcast.xml --repo $env:GITHUB_REPOSITORY --title $env:GITHUB_REF_NAME --generate-notes --latest
